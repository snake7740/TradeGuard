server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：变量式 proxy_pass 强制 nginx 按 TTL 重解析，
    # 避免上游容器重建换 IP 后 nginx 仍连启动时缓存的旧 IP（502 根因）
    resolver 127.0.0.11 valid=10s ipv6=off;
    # /api 经 Higress AI 网关（TA-C-04）统一入口转发 web-api——页面全部业务流量真实过网关（04 §5）。
    # 网关 /api 路由 → web-api.dns:8000（dns 型服务源，McpBridge）；如需旁路排障可临时改回 web-api:8000。
    set $api_upstream higress:8080;

    # 前端零内置静态数据：/api 全部经网关实时转发 web-api（真实读库）
    location /api/ {
        proxy_pass http://$api_upstream;   # 变量形式且无 URI 部分：原样透传完整请求 URI
        proxy_set_header Host $host;
        proxy_buffering off;              # SSE 实时推送不缓冲（API-W-14；网关侧已验证不缓冲）
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
