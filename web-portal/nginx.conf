server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：变量式 proxy_pass 强制 nginx 按 TTL 重解析，
    # 避免 web-api 容器重建换 IP 后 nginx 仍连启动时缓存的旧 IP（502 根因）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream web-api:8000;

    # 前端零内置静态数据：/api 全部实时转发 web-api（真实读库）
    location /api/ {
        proxy_pass http://$api_upstream;   # 变量形式且无 URI 部分：原样透传完整请求 URI
        proxy_set_header Host $host;
        proxy_buffering off;              # SSE 实时推送不缓冲（API-W-14）
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
