# TradeGuard · Sprint 0 基础设施编排（对应 docs/04 §3 部署拓扑、US-E1-01）
# 说明：
#  - AgentTeams 按官方脚本独立部署（非 compose 服务），见 scripts/install-agentteams.md
#  - PolarDB-PG 本地等价实现：pgvector/pgvector:pg16（文档 04 §2 替换成本列已声明）
#  - UnifiedModel 语义运行时走 SQL 视图退化路径（db/init/03-umodel-fallback.sql）
#  - 凭据治理（第十六轮安全加固，R-37）：所有口令/令牌经 .env 注入（gitignore 排除），
#    仓库零可用凭据；缺失即 :? 报错拒启。一键 scripts/start_all.py 自动生成 .env 随机值。
#  - 暴露面收敛：全部宿主端口绑 127.0.0.1（仅本机开发/演示可达，局域网不可达）
#  - 一键启动：cp .env.example .env → docker compose up -d（或 scripts/start_all.py）
name: tradeguard

x-python-base: &python-base
  restart: unless-stopped
  networks: [tradeguard-net]
  environment:
    PG_DSN: ${PG_DSN_APP:?请在 .env 配置 PG_DSN_APP（格式见 .env.example）}

services:
  # ---------- 数据层 ----------
  postgres:                      # PolarDB-PG 本地等价（pgvector 内置）
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradeguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD:?请在 .env 配置 PG_SUPER_PASSWORD（格式见 .env.example）}
    ports: ["127.0.0.1:5433:5432"]   # 宿主 5432 被本机 PostgreSQL 服务占用，宿主侧测试/工具走 5433（仅回环，R-37）；容器间仍用 postgres:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tradeguard-net]

  # ---------- 事件总线 ----------
  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.1}
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    ports: ["127.0.0.1:9876:9876"]   # 仅回环（R-37）：容器间通信走 rocketmq-namesrv:9876，无需对外
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tradeguard-net]

  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.1}
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx1g"
    # 不挂载 broker.conf：5.3.1 外挂 -c 配置在 Windows 卷上触发 ScheduleMessageService NPE（rocketmq-docker#85）
    # 不挂载 store 卷：镜像内无 /home/rocketmq/store，空卷挂载后属主 root 与容器用户 uid 3000 冲突（Permission denied）
    # 演示环境事件流允许重放重建；生产 Linux 环境可恢复卷挂载（scripts/rocketmq-init.md）
    depends_on:
      rocketmq-namesrv: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tradeguard-net]

  rocketmq-init:                 # case-events Topic 一次性预建（工作流 A3，US-E1-01）
    # 命令搬 scripts/rocketmq-init.md：broker 就绪后 updateTopic；until 循环容忍
    # broker 启动早期 namesrv 路由未就绪的瞬时失败。restart: "no"：建完即退。
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.1}
    restart: "no"
    entrypoint: ["sh", "-c", "until sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t case-events -r 4 -w 4; do echo 'case-events topic 未就绪，2s 后重试'; sleep 2; done"]
    depends_on:
      rocketmq-broker: { condition: service_healthy }
    networks: [tradeguard-net]

  # ---------- 治理层 ----------
  nacos:                         # AI Registry + 动态配置（BA-BR 阈值，SC-06）
    image: nacos/nacos-server:v3.2.3
    restart: unless-stopped
    environment:
      MODE: standalone
      # Nacos v3 镜像强制要求 AUTH_TOKEN；互信头与 JWT 密钥经 .env 注入（R-37：仓库零凭据，
      # start_all 自动生成随机值；scripts/nacos_register.py 与 web-api 从同一 .env 取值同源）
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 .env 配置 NACOS_AUTH_TOKEN（格式见 .env.example）}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 .env 配置 NACOS_AUTH_IDENTITY_VALUE（格式见 .env.example）}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["127.0.0.1:8848:8848", "127.0.0.1:9848:9848"]   # 仅回环（R-37）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/ || exit 1"]   # v3 已移除 v1/v2 readiness 端点，用控制台根路径探活
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tradeguard-net]

  higress:                       # AI 网关 all-in-one（控制台 8001 / 网关 HTTP 8180→容器 8080）
    # 版本锁定：2.2.3 为该仓库当前最新稳定 tag（docker manifest inspect 实测 2.2.0~2.2.3 存在、2.2.4+ 不存在，2026-08-14 查证）
    # 数据面端口实测：all-in-one 2.2.3 网关 HTTP=容器内 8080（GATEWAY_HTTP_PORT 缺省）、HTTPS=8443；
    # 容器内无 80 监听，旧映射 8180:80 恒不通（04 §5 已修正）。
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    restart: unless-stopped
    environment:
      HIGRESS_CONSOLE_DISABLE: "false"
    ports:
      - "127.0.0.1:8001:8001"   # 控制台（仅回环，R-37：杜绝未初始化控制台被首访接管）
      - "127.0.0.1:8180:8080"   # 网关 HTTP 入口（API/MCP 流量统一入口，04 §5；仅回环）
    volumes:
      - higress-data:/data
    networks: [tradeguard-net]

  # ---------- 观测层 ----------
  as-studio:                     # AgentScope Studio（OTel tracing，04 §7）
    # 版本锁定：v1.0.9 为 docker.io/agentscope/studio 当前最新版本号 tag（docker.io 直连不可达，
    # 经镜像索引 docker.aityp.com 查证 2026-08-14：仅 v1.0.8 / v1.0.9 / latest 三个 tag）
    image: agentscope/studio:v1.0.9
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]   # 仅回环（R-37：Studio 无鉴权，OTel 数据不得对外可读）
    networks: [tradeguard-net]

  # ---------- 自研服务 ----------
  mcp-core:                      # AA-MCP-01 交易风控业务库 MCP（只读 + 处置执行）
    <<: *python-base
    build: ./services/mcp-core
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8101:8101"]   # 仅回环（R-37）：web-api/AgentTeams 经容器网络名访问，宿主发布只为调试
    healthcheck:
      # FastMCP streamable-http 无 200 健康端点：/mcp/ 对普通 GET 返回 4xx（HTTPError），
      # 有 HTTP 响应即判定存活；连接拒绝/超时（URLError）才失败
      test: ["CMD-SHELL", "python -c \"import urllib.request,urllib.error\ntry: urllib.request.urlopen('http://127.0.0.1:8101/mcp/',timeout=3)\nexcept urllib.error.HTTPError: pass\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      tradeguard-net:
        aliases: [mcp-core.tg.local]    # Higress dns 型服务源需带点域名（04 §5）

  mcp-external-mock:             # AA-MCP-02 外部数据源模拟 MCP（征信/舆情/投诉）
    <<: *python-base
    build: ./services/mcp-external-mock
    ports: ["127.0.0.1:8102:8102"]   # 仅回环（R-37）
    healthcheck:
      # 同 mcp-core：FastMCP /mcp/ 有 HTTP 响应（含 4xx）即存活
      test: ["CMD-SHELL", "python -c \"import urllib.request,urllib.error\ntry: urllib.request.urlopen('http://127.0.0.1:8102/mcp/',timeout=3)\nexcept urllib.error.HTTPError: pass\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      tradeguard-net:
        aliases: [mcp-external-mock.tg.local]

  web-api:                       # web-portal 后端进程（FastAPI，04 §10.1 三端调用链）
    <<: *python-base
    build: ./services/web-api
    depends_on:
      postgres: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
      nacos: { condition: service_healthy }          # 阈值热加载依赖（US-E1-03）
      mcp-core: { condition: service_healthy }       # AA-SK 工具链依赖（US-E3-03/04）
    env_file:
      - path: secrets/dashscope.env      # LLM 凭据（DASHSCOPE_API_KEY / AGENTTEAMS_OPENAI_BASE_URL）
        required: false                 # clone 后无此文件即降级 baseline（R-40 语义 RAG）
    environment:
      PG_DSN: ${PG_DSN_WEB:?请在 .env 配置 PG_DSN_WEB（格式见 .env.example）}
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      NACOS_ADDR: http://nacos:8848                    # US-E1-03 阈值热加载源
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 .env 配置 NACOS_AUTH_IDENTITY_VALUE}
      # US-E7-01 bearer 守卫强制开启（R-37）：缺失即拒启；门户 nginx 反代自动注入该令牌
      TG_API_TOKEN: ${TG_API_TOKEN:?请在 .env 配置 TG_API_TOKEN（格式见 .env.example）}
      MCP_CORE_URL: http://mcp-core:8101/mcp/                 # AA-MCP-01 聚合落库/处置执行（US-E3-03/04）
      MCP_EXTERNAL_URL: http://mcp-external-mock:8102/mcp/    # AA-MCP-02 外部数据源
      TG_OTLP_ENDPOINT: http://as-studio:3000                 # TA-C-07：技能 span 经 OTLP 直推 AgentScope Studio（best-effort，断链仅降级 JSONL）
      TG_EVENT_WORKER: "on"      # AA-CL-01/02 闭环：CaseRegistered 消费者（代码缺省 OFF，
                                 # 测试进程不开；仅容器化部署显式启用，core/event_worker.py）
    ports: ["127.0.0.1:8200:8000"]   # 仅回环（R-37）：对外入口收敛到 Higress/门户 nginx
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      tradeguard-net:
        aliases: [web-api.tg.local]

  web-portal:                    # web-portal 前端进程（Vue3 + Element Plus）
    build: ./web-portal
    restart: unless-stopped
    depends_on:
      web-api: { condition: service_healthy }
    environment:
      # R-37：nginx 启动时 envsubst 将令牌注入 /api 反代（浏览器无感知，前端零改动）；
      # 过滤器限定只替换 TG_* 变量，nginx 原生 $变量不受影响
      TG_API_TOKEN: ${TG_API_TOKEN:?请在 .env 配置 TG_API_TOKEN（格式见 .env.example）}
      NGINX_ENVSUBST_FILTER: "^TG_"
    ports: ["127.0.0.1:8300:80"]   # 仅回环（R-37）
    healthcheck:
      # nginx:1.27-alpine 自带 busybox wget（已实测容器内 /usr/bin/wget 可用）
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [tradeguard-net]

  data-generator:                # 合成数据发生器（04 §8，PaySim 式分布）
    <<: *python-base
    build: ./services/data-generator
    profiles: ["tools"]          # 按需运行：docker compose run --rm data-generator
    depends_on:
      postgres: { condition: service_healthy }
    networks: [tradeguard-net]

networks:
  tradeguard-net:
    driver: bridge

volumes:
  pg-data:
  higress-data:
