openapi: 3.0.3
info:
  title: TradeGuard 交易风控中枢 API 契约
  version: 1.0.0
  description: |
    统一 OpenAPI 3.0 契约，覆盖两类接口：
    1. web-api REST 接口（/api/**，供 web-portal 前端与演示调用，见 04 §10.1）；
    2. MCP 工具契约（AA-MCP-01/02 的 12+3 个工具，MCP 为 JSON-RPC 传输，
       其输入/输出 Schema 统一在 components.schemas 中以 x-mcp-tool 标注，
       与 REST 接口共用同一套组件，保证"所有接口统一 OpenAPI 3.0 规范"）。
    追溯：业务规则 BA-BR-x（01 §5）、场景 SC-x（06 §2）、数据字典 DD（08）。
servers:
  - url: http://localhost:8200
    description: web-api（docker compose 演示环境，宿主端口映射 8200→8000）
tags:
  - name: 演示触发
  - name: 事件工作台
  - name: 审批门户
  - name: 审计查询
  - name: 知识库后台
  - name: 实时推送
  - name: 系统

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [系统]
      operationId: health
      security: []
      summary: 健康检查（DB/RMQ/Agent 侧依赖探活）
      responses:
        '200':
          description: 各依赖状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DEGRADED] }
                  components:
                    type: object
                    additionalProperties: { type: string }

  /api/alerts:
    post:
      tags: [演示触发]
      operationId: submitAlert
      summary: 告警/任务输入受理（AA-CL-01 载体，演示剧本触发入口）
      description: |
        写入立案后由 EventWorker（DB 轮询主力，2s；RocketMQ CaseRegistered 尽力而为
        旁路加速）自动承接聚合，无需人工推动（AA-CL-01/02 闭环）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertInput' }
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id: { $ref: '#/components/schemas/CaseId' }
                  status: { type: string, enum: [REGISTERED] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/demo/subjects:
    get:
      tags: [演示触发]
      operationId: listDemoSubjects
      summary: 可用演示主体清单（API-W-21，门户"触发演示事件"取材入口）
      description: |
        从 account 表返回无未结案件（status<>ARCHIVED 视为未结）的真实主体；
        随机 subject_ref 不在三源底表内会令聚合走降级路径，演示语义失真，故前端一律经此取材。
        severity 软过滤（BUG-01/R-46）：high 取 black/block 名单主体（黑名单垫分 75，
        必走"调查→审批"人机链）；low 取 none 干净主体（低分自动放行）；
        medium/缺省不过滤（全表随机，与 v1.4.4 行为兼容）。
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 50 } }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high] }
          description: 按立案严重度软过滤候选主体（缺省不过滤）
      responses:
        '200':
          description: 候选主体列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        subject_ref: { type: string, description: account_hash（64 位） }
                        list_flag: { type: string, enum: [none, watch, gray, black] }
                        risk_level: { type: integer, minimum: 0, maximum: 5 }

  /api/cases:
    get:
      tags: [事件工作台]
      operationId: listCases
      summary: 风险事件列表（真实读 DA-T-03）
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { name: risk_min, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CaseSummary' }

  /api/cases/{case_id}:
    get:
      tags: [事件工作台]
      operationId: getCase
      summary: 事件详情（含共享状态 context，真实读 DA-T-03）
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cases/{case_id}/signals:
    get:
      tags: [事件工作台]
      operationId: listSignals
      summary: 事件信号清单（真实读 DA-T-04）
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 信号列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RiskSignal' }

  /api/cases/{case_id}/aggregate:
    post:
      tags: [事件工作台]
      operationId: aggregateCase
      summary: 触发信号聚合（API-W-17，AA-SK-01 确定性内核，SC-01/SC-11 载体）
      description: |
        立案→聚合（四源采集+防腐层翻译+降噪合并+velocity BA-BR-14+加权评分）→分级裁决：
        零信号降噪 ARCHIVED；低风险小额（风险分<40 且涉案<5000，BA-BR-01）自动放行 DISPOSED（BA-CAP-05）；
        其余转调查 INVESTIGATING；全源失败 E-AGG-ALL-FAIL 转人工。信号经 AA-MCP-01 落 DA-T-04（tg_app 写角色 DA-INV-05）。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 聚合完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateResult' }
        '404':
          description: 事件不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 状态冲突（非 REGISTERED/AGGREGATING 或全源失败转人工）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/cases/{case_id}/evidence:
    get:
      tags: [事件工作台]
      operationId: listEvidence
      summary: 证据链（真实读 DA-T-05，审批门户展示依据）
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 证据列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evidence' }

  /api/cases/{case_id}/dispositions:
    get:
      tags: [事件工作台]
      operationId: listDispositions
      summary: 处置执行记录（API-W-22，真实读 DA-T-06，按执行时序）
      description: 前端核验入口（API-W-19）依此取最近一条 executed 凭证作为 exec_id。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 处置记录列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Disposition' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cases/{case_id}/graph:
    get:
      tags: [事件工作台]
      operationId: getRelatedGraph
      summary: 关联网络图谱（经 mcp-core query_related_graph，与 Agent 同源）
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
        - { name: hops, in: query, schema: { type: integer, default: 2, maximum: 2 } }
      responses:
        '200':
          description: 图谱
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphResponse' }

  /api/cases/{case_id}/review:
    post:
      tags: [事件工作台]
      operationId: submitReview
      summary: 中风险人工复核结论（SC-10 载体，BA-BR-01 中风险分段）
      description: |
        写 DA-T-03 状态 + 审计留痕（BA-BR-09），actor 取 X-Operator 头（human_only 守卫）。
        release→ReviewDismissed 排除欺诈归档 ARCHIVED；
        block/escalate→委托 AA-SK-03 review_confirm 自动建处置审批工单（API-M-11，US-E5-04），
        escalate 额外审计标记升级。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: 复核完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '409':
          description: 状态冲突（非 MANUAL_REVIEW 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/cases/{case_id}/investigate:
    post:
      tags: [事件工作台]
      operationId: investigateCase
      summary: 触发欺诈调查（API-W-18，AA-SK-02 确定性内核，US-E4-01~03 载体）
      description: |
        假设匹配（规则兜底 + DA-KB-01 检索引用 doc_id，未命中显式声明）→
        fn_related_graph 2 跳扩展（BA-BR-06 命中黑名单 +30 幂等，API-M-13）→
        影响面统计 → 证据固化 DA-T-05（API-M-12）→ InvestigationCompleted 转 PENDING_APPROVAL。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 调查完成（假设/图谱/影响面/证据固化）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationResult' }
        '404':
          description: 事件不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 状态冲突（非 INVESTIGATING）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/cases/{case_id}/disposition:
    post:
      tags: [事件工作台]
      operationId: submitDisposition
      summary: 处置提交（API-W-23，AA-SK-03 确定性内核，US-E5-02，SC-02/07/10 载体）
      description: |
        调查完成后的人工提交入口，补齐 UI 全链「调查→审批」交接（D2）。
        高风险无凭证 → mcp-core 拒 E-DISP-AUTH → 建审批工单转待审批（SC-02，
        route=approval_required）；中风险无凭证 → refused_mid_risk（E-DISP-SCOPE，
        SC-10）；已批凭证 → 自动执行至 DISPOSED（route=executed）。
        同案已存在待决工单时幂等返回既有工单（一案一单，duplicate=true）。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispositionRequest' }
      responses:
        '200':
          description: 处置提交结果（路由裁决：approval_required / refused_mid_risk / executed / idempotent_hit）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispositionResult' }
        '404':
          description: 案件不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 案件状态不支持提交处置（E-BAD-STATE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  
  /api/cases/{case_id}/verify:
    post:
      tags: [事件工作台]
      operationId: verifyCase
      summary: 触发结果核验（API-W-19，AA-SK-04 确定性内核，US-E6-01/02 载体）
      description: |
        三分支裁决（B3）：
        1. 执行一致（无论 trace 是否完整）→VerificationPassed→VERIFIED→CaseArchived→ARCHIVED，
           审计报告落 DA-T-05，复盘摘要提入库申请（pending）；trace 缺口仅审计告警
           verification.trace_gap，绝不回滚一致执行；
        2. 不一致→VerificationFailed→反向处置（幂等键 :rollback 后缀，凭证按原动作+逆对
           兜底查询，C1 逆动作对授权）→RollbackExecuted→MANUAL_REVIEW + verification.p0 审计；
        3. 不一致且反向处置被拒/失败→RollbackEscalated→MANUAL_REVIEW +
           verification.escalated 审计（未执行反向不写 P0 已回滚）。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: 核验完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResult' }
        '404':
          description: 事件或执行凭证不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 状态冲突（非 DISPOSED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/approvals:
    get:
      tags: [审批门户]
      operationId: listApprovals
      summary: 待审批/已审批队列（真实读 DA-T-07，BA-BR-13 超时标记）
      parameters:
        - { name: decision, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        '200':
          description: 审批列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }

  /api/approvals/{approval_id}/decide:
    post:
      tags: [审批门户]
      operationId: decideApproval
      summary: 批准/驳回（02 §7 状态机人类触发入口，SC-02/SC-03 载体）
      description: |
        回填 DA-T-07 decision（回填后不可变更）→ 发布 ApprovalApproved/ApprovalRejected
        事件（actor=真实操作人）→ 审计留痕。驳回触发 BA-BR-07 回滚人工复核。
      parameters:
        - { name: approval_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: 决策完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409':
          description: 工单已决策（幂等返回首次结果）或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/audit/{case_id}:
    get:
      tags: [审计查询]
      operationId: getAuditTrail
      summary: 审计链回放（SC-08 载体，经 mcp-core query_audit_trail）
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 按时间排序的完整审计链
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditRecord' }

  /api/audit/{case_id}/precheck:
    get:
      tags: [审计查询]
      operationId: getAuditPrecheck
      summary: 专家清单预检（D1，US-E10；只读体检，不推进状态）
      description: |
        处置要件六项逐项体检：signals_present / evidence_chain /
        hypothesis_fixed / cross_review_done / debate_recorded /
        disposition_anchored；status 取 ok/warn/fail，passed=无 fail。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
      responses:
        '200':
          description: 预检清单
          content:
            application/json:
              schema:
                type: object
                required: [case_id, status, items, passed]
                properties:
                  case_id: { type: string }
                  status: { type: string, description: 案件当前状态 }
                  passed: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, status, basis]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        status: { type: string, enum: [ok, warn, fail] }
                        basis: { type: string }

  /api/deadletter:
    get:
      tags: [LoopEngine]
      operationId: listDeadletter
      summary: DLQ 死信清单（API-W-25，LoopEngine 失败归宿可见性入口，只读）
      description: |
        processing_deadletter（DA-T-16）清单，默认仅驻车行（parked_only=true），
        按最近失败时间倒序限 100 条；环的失败不再只留日志（E-WORKER-DLQ 同源）。
      parameters:
        - name: parked_only
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: DLQ 清单
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [case_id, stage, attempts, parked]
                      properties:
                        case_id: { type: string }
                        stage: { type: string, description: 失败阶段（如 aggregation） }
                        error_class: { type: string }
                        error_msg: { type: string }
                        attempts: { type: integer, description: 累计重试次数 }
                        parked: { type: boolean, description: 驻车中（停扫） }
                        first_failed_at: { type: string, format: date-time }
                        last_failed_at: { type: string, format: date-time }
                        resolved_by: { type: string, nullable: true, description: 复位人（human:*） }
                        resolved_at: { type: string, format: date-time, nullable: true }

  /api/deadletter/{case_id}/retry:
    post:
      tags: [LoopEngine]
      operationId: retryDeadletter
      summary: DLQ 人工复位放行（API-W-26，人工门；复位后案件重入轮询候选）
      description: |
        解除驻车、清零累计 attempts，resolved_by/resolved_at 落复位人与时间
        （环记录只增，复位不删行）；案件重新被 EventWorker 轮询捞起。
        调用者须为人类角色（X-Operator，缺省 human:risk_oncall）；
        DLQ 无该案件记录时 404 E-NOT-FOUND。
      parameters:
        - { $ref: '#/components/parameters/CaseIdPath' }
        - name: X-Operator
          in: header
          required: false
          schema: { type: string }
          description: 复位人（encodeURIComponent 编码，缺省 human:risk_oncall）
      responses:
        '200':
          description: 复位完成
          content:
            application/json:
              schema:
                type: object
                required: [ok, case_id]
                properties:
                  ok: { type: boolean }
                  case_id: { type: string }
        '404':
          description: DLQ 无该案件记录（E-NOT-FOUND）

  /api/kb/applications:
    get:
      tags: [知识库后台]
      operationId: listKbApplications
      summary: 知识入库申请列表（真实读 DA-T-09，status=pending）
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KbDocument' }

  /api/kb/ask:
    post:
      tags: [知识库后台]
      operationId: askKb
      summary: B 端知识问答（API-W-27，US-E14/SC-22，BA-BR-23）
      description: |
        仅引用已发布知识（DA-KB-01 检索 Top-k + 相似度阈值），回答由检索结果
        组装（构造性防幻觉）；未命中 grounded=false 且声明无先例。仅对已识别
        人工角色开放（agent:/未识别 403 E-FORBIDDEN-ROLE），问答留痕 kb.ask。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: 带引用回答
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: string }
                  grounded: { type: boolean }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        doc_id: { type: string }
                        title: { type: string }
                        similarity: { type: number }
                  answer: { type: string }
        '403':
          description: 非人工角色拒绝（E-FORBIDDEN-ROLE）

  /api/kb/applications/{doc_id}/publish:
    post:
      tags: [知识库后台]
      operationId: publishKbDocument
      summary: 确认发布（SC-05 载体，DA-INV-06 人工门控，仅策略管理员）
      description: |
        operator 缺省取 X-Operator 头（门户自动携带当前角色，URL 编码），
        无头时回落 human:kb_admin；显式传值优先且须匹配 ^human:[a-z_]{1,34}$。
      parameters:
        - { $ref: '#/components/parameters/DocIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                operator: { type: string, pattern: '^human:[a-z_]{1,34}$' }
                comment: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 已发布并触发向量化
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbDocument' }
        '409':
          description: 状态非 pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/kb/applications/{doc_id}/reject:
    post:
      tags: [知识库后台]
      operationId: rejectKbDocument
      summary: 驳回入库申请（意见必填）
      parameters:
        - { $ref: '#/components/parameters/DocIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opinion]
              properties:
                opinion: { type: string, minLength: 5 }
      responses:
        '200':
          description: 已驳回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbDocument' }

  /api/events/stream:
    get:
      tags: [实时推送]
      operationId: eventStream
      summary: 领域事件实时推送（SSE，订阅进程内事件总线）
      description: |
        演示时事件流转现场可见。事件源为 web-api 进程内总线（InMemoryPublisher fan-out），
        RocketMQ 为旁路广播通道（尽力而为）；15s keepalive 心跳防代理断链。
        R-37：SSE 不再豁免鉴权，随全局 bearerAuth 校验 TG_API_TOKEN
        （门户 nginx envsubst 注入，浏览器无感）。
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/SseEvent' }

  /api/config/thresholds:
    get:
      tags: [系统]
      operationId: getThresholdConfig
      summary: BA-BR 阈值动态配置读取（US-E1-03，SC-06）
      description: |
        Nacos（group=TRADEGUARD, dataId=ba-br-thresholds）优先，不可用时降级 sys_config 种子。
        web-api 每 5s 热加载，配置变更不重启生效（US-E1-03 验收标准）。
      responses:
        '200':
          description: 当前阈值与来源
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, enum: [nacos, db] }
                  updated_at: { type: string, format: date-time }
                  values:
                    type: object
                    additionalProperties: { type: string }
    put:
      tags: [系统]
      operationId: putThresholdConfig
      summary: BA-BR 阈值动态配置写入（US-E1-03，SC-06）
      description: |
        阈值键值对写入 sys_config（DA-T-11，UPDATE 优先，tg_web 权限矩阵）并触发
        ConfigService 即时重载；操作者取 X-Operator 头（URL 编码中文，后端 unquote），
        写操作落 audit_log（BA-BR-09）。需 bearer 守卫（US-E7-01）。
      parameters:
        - name: X-Operator
          in: header
          required: false
          schema: { type: string }
          description: 操作者（encodeURIComponent 编码，缺省 human:operator）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              description: 阈值键值对（如 br-05-window-days、7）
      responses:
        '200':
          description: |
            写入后的最新快照（同 GET 响应结构）。写回顺序：先 Nacos → 再 sys_config →
            即时 reload；Nacos 写回失败不阻断 DB 写入，经 nacos_writeback 暴露。
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, enum: [nacos, db] }
                  updated_at: { type: string, format: date-time }
                  values:
                    type: object
                    additionalProperties: { type: string }
                  nacos_writeback: { type: boolean, description: Nacos 写回是否成功（false=仅 DB 生效） }
        '400':
          description: 配置键不存在且无新增权限（E-CONFIG-KEY）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/observability/traces:
    get:
      tags: [系统]
      operationId: getTraces
      summary: 技能执行 Trace 回放（API-W-20，US-E7-04 可观测，04 §7）
      description: |
        回放 AA-SK-01~04 确定性内核执行 span（JSONL 留痕，跨重启可读），
        trace_id=case_id 与 AgentScope Studio（as-studio:3000）Agent 侧观测关联；
        case_id 过滤用于单案件全链回放（SC-08 留痕完整率取证）。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: case_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 最近 span 列表（最新在后）
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  spans:
                    type: array
                    items: { $ref: '#/components/schemas/TraceSpan' }

  /api/skills:
    get:
      tags: [系统]
      operationId: listSkills
      summary: Skill 注册表（API-W-24，AA-SK 自包含打包的消费侧，skills/README.md）
      description: |
        运行时装载 skills/AA-SK-*.md frontmatter（12 键）并校验 entrypoint
        可导入——skill 包从「文档自包含」升级为「Agent 基座可发现/可分派」；
        每请求实时装载（与阈值热加载同精神，frontmatter 变更免重启可见）。
        坏包不阻断：loadable=false + error 留痕，与 degradation-paths 声明精神一致。
      responses:
        '200':
          description: 已装载 skill 列表（含不可装载包的留痕）
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/SkillSpec' }

  /api/skills/{name}:
    get:
      tags: [系统]
      operationId: getSkill
      summary: 单个 skill 装载详情（API-W-24）
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, example: AA-SK-01-signal-aggregation }
      responses:
        '200':
          description: skill 装载详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillSpec' }
        '404':
          description: skill 不存在（契约错误信封）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 演示环境静态 token；生产替换为机构 SSO（替换成本见 04 §2）

  parameters:
    CaseIdPath:
      name: case_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CaseId' }
    DocIdPath:
      name: doc_id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 错误码（08 §6 错误码表）
          example: E-DISP-AUTH
        message: { type: string }
        trace_id: { type: string, description: OTel trace_id，联动可观测 }

    CaseId:
      type: string
      pattern: '^CASE-\d{8}-[0-9a-f]{6}$'
      example: CASE-20260813-a1b2c3

    CaseStatus:
      type: string
      description: 状态机（02 §7 + 08 §2 枚举字典，DA-INV-01 守护）
      enum: [REGISTERED, AGGREGATING, INVESTIGATING, PENDING_APPROVAL,
             APPROVED, REJECTED, MANUAL_REVIEW, DISPOSING, DISPOSED,
             VERIFIED, ROLLBACK, ARCHIVED]

    AlertInput:
      type: object
      required: [source_type, subject_ref]
      properties:
        source_type:
          type: string
          enum: [engine_alert, fraud_ticket, tx_anomaly, demo_script]
        # R-37 复审收口：maxLength 对齐 risk_case.subject_ref varchar(64)，超长拒绝防 500
        subject_ref: { type: string, maxLength: 64, description: 账户哈希或交易哈希 }
        severity: { type: string, enum: [low, medium, high], default: medium }
        payload:
          type: object
          additionalProperties: true
          description: 原始告警上下文（交易快照/工单摘要）

    CaseSummary:
      type: object
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        subject_ref: { type: string }
        status: { $ref: '#/components/schemas/CaseStatus' }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        current_agent: { type: string, description: AA-AG-0x 编号 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # 审批超时标记不在案件摘要上：BA-BR-13 升级写在 DA-T-07 escalated_at（API-W-08 返回）

    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            context:
              type: object
              additionalProperties: true
              description: 共享状态（DA-T-03 context_json，AA-CL-03 载体）
            signal_count: { type: integer }
            evidence_count: { type: integer }
            matrix_room: { type: string, description: Matrix 房间链接 }
            trace_id: { type: string }

    RiskSignal:
      type: object
      description: DA-T-04 信号结构（四源统一，03 §4）
      properties:
        signal_id: { type: string }
        case_id: { $ref: '#/components/schemas/CaseId' }
        source: { type: string, enum: [tx, credit, sentiment, complaint] }
        type: { type: string, example: high_freq_small_amount }
        confidence: { type: number, minimum: 0, maximum: 1 }
        raw_ref: { type: string, description: 原始数据引用（tx_id 或外部源 id） }
        query_reason: { type: string, description: 查询事由（BA-BR-10 必填） }
        degraded: { type: boolean, description: 数据源降级标记 }
        velocity_json:
          type: object
          nullable: true
          description: 频次统计特征（BA-BR-14，对标社区 velocity 实践）；tx 源信号必填
          properties:
            velocity_1h: { type: object, description: "近 1 小时 {count, amount}" }
            velocity_24h: { type: object, description: "近 24 小时 {count, amount}" }
        ts: { type: string, format: date-time }

    VelocityFeature:
      type: object
      description: 频次统计特征（BA-BR-14，与 RiskSignal.velocity_json 同构）
      properties:
        velocity_1h:
          type: object
          properties:
            count: { type: integer, description: 近 1 小时交易笔数 }
            amount: { type: number, description: 近 1 小时交易金额 }
        velocity_24h:
          type: object
          properties:
            count: { type: integer, description: 近 24 小时交易笔数 }
            amount: { type: number, description: 近 24 小时交易金额 }

    AggregateResult:
      type: object
      description: AA-SK-01 聚合流水线结果（US-E3-03/04，分级裁决路由）
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        route:
          type: string
          enum: [noise, auto_release, investigate, all_fail]
          description: 裁决路由（降噪/自动放行/转调查/全源失败转人工）
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        velocity: { $ref: '#/components/schemas/VelocityFeature' }
        signals_count: { type: integer }
        degraded_sources:
          type: array
          items: { type: string, enum: [tx, credit, sentiment, complaint] }
        exec_id: { type: string, nullable: true, description: 自动放行处置凭证（DA-T-06） }

    Evidence:
      type: object
      description: DA-T-05 证据条目（共享内核结构，01 §10.2）
      properties:
        evidence_id: { type: string }
        case_id: { $ref: '#/components/schemas/CaseId' }
        claim: { type: string, description: 结论主张 }
        source_ref: { type: string, description: 数据来源（含 RAG doc_id 引用） }
        confidence: { type: number, minimum: 0, maximum: 1 }
        ts: { type: string, format: date-time }

    Disposition:
      type: object
      description: DA-T-06 处置记录
      properties:
        exec_id: { type: string }
        case_id: { $ref: '#/components/schemas/CaseId' }
        action: { type: string, enum: [block, freeze, reduce, release] }
        amount: { type: number, format: double, description: 涉案/调整金额 }
        idempotency_key:
          type: string
          description: case_id+decision_type（AA-SK-03，DA-INV-03）
        approval_ref: { type: string, nullable: true }
        status:
          type: string
          enum: [submitted, executed, failed, rolled_back]
        ts: { type: string, format: date-time }

    Approval:
      type: object
      description: DA-T-07 审批工单（AG-04 创建、人类回填）
      properties:
        approval_id: { type: string }
        case_id: { $ref: '#/components/schemas/CaseId' }
        approver: { type: string, nullable: true }
        decision: { type: string, enum: [pending, approved, rejected] }
        opinion: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        requested_action:
          type: string
          enum: [block, freeze, reduce, release]
          nullable: true
          description: 建单请求的处置动作（C1 凭证验真比对项）
        requested_amount: { type: number, nullable: true, description: 涉案金额 }
        escalated_at:
          type: string
          format: date-time
          nullable: true
          description: BA-BR-13/SC-09 超时升级时刻（非空即前端标红，后台扫描每轮幂等写入）

    ReviewRequest:
      type: object
      required: [conclusion, opinion]
      properties:
        conclusion: { type: string, enum: [release, block, escalate] }
        opinion: { type: string, minLength: 5 }

    VerifyRequest:
      type: object
      required: [exec_id]
      properties:
        exec_id: { type: string, description: 待核验处置执行凭证（DA-T-06） }

    DispositionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [block, freeze, reduce, release], description: 处置动作（白名单与 API-M-11 requested_action 对齐） }
        amount: { type: number, minimum: 0, maximum: 10000000, nullable: true, description: 处置金额（reduce 限额等场景，可选） }
        idempotency_key: { type: string, maxLength: 120, nullable: true, description: 幂等键（缺省由服务端按 case+action 生成） }

    DispositionResult:
      type: object
      description: AA-SK-03 处置提交裁决（SC-02 路由）
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        route: { type: string, enum: [approval_required, refused_mid_risk, executed, idempotent_hit, failed_manual, evidence_missing], description: 裁决路由 }
        code: { type: string, description: 处置门控错误码（E-DISP-AUTH/E-DISP-SCOPE 等） }
        approval_id: { type: string, description: 建单成功时的审批工单号 }
        exec_id: { type: string, description: 执行成功时的处置凭证（DA-T-06） }
        case_status: { $ref: '#/components/schemas/CaseStatus' }
        duplicate: { type: boolean, description: 同案已有待决工单时幂等返回既有工单（一案一单） }

    InvestigationResult:
      type: object
      description: AA-SK-02 调查结果（US-E4-01~03）
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        case_status: { $ref: '#/components/schemas/CaseStatus' }
        hypothesis:
          type: object
          properties:
            pattern: { type: string, description: 定性假设（跑分/盗卡/团伙盗刷/待定） }
            rule_basis: { type: string, description: 规则兜底依据 }
            citations:
              type: array
              items: { type: object, properties: { doc_id: { type: string }, title: { type: string }, similarity: { type: number } } }
            kb_note: { type: string, description: 未命中时显式声明"无库内匹配" }
        graph:
          type: object
          properties:
            nodes: { type: integer }
            edges: { type: integer }
            edge_types: { type: array, items: { type: string } }
            black_hits: { type: array, items: { type: string } }
        impact:
          type: object
          properties:
            accounts: { type: integer }
            amount_24h: { type: number }
        evidence_fixed: { type: boolean }

    VerificationResult:
      type: object
      description: AA-SK-04 核验结果（US-E6-01/02）
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        consistency_check: { type: boolean }
        trace_complete: { type: boolean }
        case_status: { $ref: '#/components/schemas/CaseStatus' }
        audit_report: { type: string, description: 核验一致时的审计报告（落 DA-T-05） }
        kb_application: { type: string, description: 复盘入库申请 doc_id（pending） }
        rollback_exec_id: { type: string, description: 核验不一致时的反向处置凭证 }

    DecideRequest:
      type: object
      required: [decision, opinion]
      properties:
        decision: { type: string, enum: [approve, reject] }
        opinion: { type: string, minLength: 5, description: 批准/驳回意见均必填（02 §7） }

    AuditRecord:
      type: object
      description: DA-T-08 审计条目（append-only，BA-BR-09）
      properties:
        log_id: { type: string }
        actor: { type: string, description: AA-AG-0x 或人类账号 }
        action: { type: string }
        target: { type: string }
        basis: { type: string, description: 依据（规则编号/审批凭证/风险分） }
        trace_id: { type: string }
        ts: { type: string, format: date-time }

    KbDocument:
      type: object
      description: DA-T-09 知识文档/入库申请
      properties:
        doc_id: { type: string }
        category: { type: string, enum: [case, regulation, runbook] }
        title: { type: string }
        content_summary: { type: string }
        status: { type: string, enum: [pending, published, rejected] }
        applicant: { type: string, description: 固定 AA-AG-05 }
        ts: { type: string, format: date-time }

    GraphNode:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [Account, Device, Transaction, PayeeAccount, IpRange, Contact, Case], description: DA-N-01~07 }
        risk_flag: { type: string, enum: [none, watch, gray, black] }
    GraphLink:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        relation: { type: string, enum: [SAME_DEVICE, SAME_PAYEE, SAME_IPSEG, SAME_CONTACT, INITIATED, INVOLVED_IN], description: DA-L-01~06 }
    GraphResponse:
      type: object
      properties:
        start: { type: string }
        hops: { type: integer }
        nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
        links: { type: array, items: { $ref: '#/components/schemas/GraphLink' } }

    SseEvent:
      type: object
      description: |
        SSE 事件体（03 §9.2 消息体 Schema，扁平信封）。trace_id 透传案件 trace_id
        （A4：同案事件可观测侧串联回放；无案件上下文的定时器事件回落新 uuid）。
        ApprovalEscalated/VerificationOverdue 为后台巡检事件，不驱动状态迁移。
        E-INV-HYPOTHESIS/E-REVIEW-DEBATE/E-KB-DECAY/E-OUTCOME-FOLLOW 为 docs/14
        增强事件（B3/C1/E1/C2）：均为留痕/观测类，不驱动状态迁移。
        E-WORKER-DLQ 为 LoopEngine 环设施事件：聚合环重试累计达 DLQ 上限驻车
        时发出（可见性入口 /api/deadletter），不驱动状态迁移。
      properties:
        event:
          type: string
          enum: [CaseRegistered, AggregationStarted, SignalsAggregated, NoiseDismissed,
                 InvestigationRequested, InvestigationCompleted,
                 ApprovalApproved, ApprovalRejected, ApprovalEscalated,
                 DispositionSubmitted, DispositionExecuted, DispositionFailed,
                 RollbackToReview, VerificationPassed, VerificationFailed,
                 VerificationOverdue, RollbackExecuted, RollbackEscalated,
                 ReviewConfirmed, ReviewDismissed, CaseArchived,
                 E-INV-HYPOTHESIS, E-REVIEW-DEBATE, E-KB-DECAY, E-OUTCOME-FOLLOW,
                 E-WORKER-DLQ]
        case_id: { $ref: '#/components/schemas/CaseId' }
        trace_id: { type: string, description: 案件 trace_id 透传（缺省回落新 uuid） }
        actor: { type: string, description: 触发者（agent:AA-AG-0x 或 human:*） }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    # ============ MCP 工具契约（AA-MCP-01/02，x-mcp-tool 标注） ============
    McpQueryTransactionsReq:
      x-mcp-tool: query_transactions
      x-mcp-server: AA-MCP-01
      type: object
      required: [account_hash, time_range]
      properties:
        account_hash: { type: string }
        time_range: { type: string, example: '2026-08-01/2026-08-13' }
        limit: { type: integer, default: 200 }
    McpQueryTransactionsResp:
      type: object
      properties:
        transactions:
          type: array
          items:
            type: object
            properties:
              tx_id: { type: string }
              amount: { type: number }
              mcc: { type: string }
              channel: { type: string }
              ts: { type: string, format: date-time }
    McpQueryRelatedGraphReq:
